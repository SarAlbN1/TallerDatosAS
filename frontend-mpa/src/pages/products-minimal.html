<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Minimal - TallerDatosAS MPA</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-database"></i>
                <span>TallerDatosAS</span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <header class="page-header">
                <h1><i class="fas fa-box"></i> Productos - Versión Minimal</h1>
                <p>Solo carga productos, sin otras funciones</p>
            </header>

            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando productos...</p>
            </div>

            <div class="error" id="error" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <p id="errorMessage"></p>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Los productos se cargarán aquí dinámicamente -->
            </div>
        </div>
    </main>

    <script src="../../config.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Solo la función de carga de productos
        let allProducts = [];

        // Cargar productos desde la API REST
        async function loadProducts() {
            try {
                console.log('Cargando productos...');
                Utils.showLoading('loading');
                Utils.hideError('error');
                
                allProducts = await RestService.getProducts();
                console.log('Productos recibidos:', allProducts);
                renderProducts(allProducts);
                
            } catch (error) {
                console.error('Error loading products:', error);
                Utils.showError('error', `Error al cargar productos: ${error.message}`);
            } finally {
                Utils.hideLoading('loading');
            }
        }

        // Renderizar productos en la grilla
        function renderProducts(products) {
            console.log('Renderizando productos:', products);
            const grid = document.getElementById('productsGrid');
            if (!grid) {
                console.error('Elemento productsGrid no encontrado');
                return;
            }

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-box-open"></i>
                        <h3>No hay productos</h3>
                        <p>No se encontraron productos que coincidan con los criterios de búsqueda.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="card-header">
                        <h3 class="card-title">${product.nombre || product.name}</h3>
                        <span class="card-id">#${product.id}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p><strong>Organización:</strong> ${product.organizacion || product.organization?.name || 'N/A'}</p>
                            <p><strong>Categoría:</strong> ${product.categoria || product.category?.name || 'N/A'}</p>
                            ${product.descripcion ? `<p><strong>Descripción:</strong> ${product.descripcion}</p>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            
            console.log('Productos renderizados exitosamente');
        }

        // Inicialización de la página
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM cargado, iniciando carga de productos...');
            loadProducts();
        });
    </script>
</body>
</html>
