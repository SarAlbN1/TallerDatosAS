spring.application.name=client-java

# Configuración JTA Atomikos
spring.jta.atomikos.properties.default-jta-timeout=300000
spring.jta.atomikos.properties.max-timeout=300000
spring.jta.atomikos.properties.enable-logging=true
spring.jta.atomikos.properties.log-base-dir=./logs
spring.jta.atomikos.properties.checkpoint-interval=500000
spring.jta.atomikos.properties.recovery-delay=10000
spring.jta.atomikos.datasource.max-pool-size=15
spring.jta.atomikos.datasource.min-pool-size=2
spring.jta.atomikos.datasource.max-lifetime=20000
spring.jta.atomikos.datasource.borrow-connection-timeout=120

# Datasource configurations are handled in DataSourceConfig.java
# These properties are kept for reference but not used by the application

# JPA Global
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JSON encoding
spring.jackson.encoding.charset=UTF-8
spring.jackson.default-property-inclusion=non_null

# gRPC Configuration
grpc.server.port=9090
grpc.server.address=0.0.0.0

# gRPC Client Configuration
grpc.client.purchase-service.address=static://localhost:9090
grpc.client.purchase-service.negotiation-type=plaintext
grpc.client.user-service.address=static://localhost:9090
grpc.client.user-service.negotiation-type=plaintext

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# Email Configuration (Mailtrap for testing)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${EMAIL_USERNAME:19aa0f3606c7fc}
spring.mail.password=${EMAIL_PASSWORD:cfc52f63310f7b}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=sandbox.smtp.mailtrap.io

# Email Templates
email.from=noreply@tallerdatosas.com
email.from.name=TallerDatosAS